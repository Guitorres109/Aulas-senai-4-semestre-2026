<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,.25);
        }

        .perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .descricao {
            opacity: .9;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .links a {
            text-decoration: none;
            color: #2563eb;
            background: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: .3s;
        }

        .links a:hover {
            transform: translateY(-3px);
            background: #dbeafe;
            box-shadow: 0 8px 18px rgba(0,0,0,.2);
        }

        footer {
            margin-top: 30px;
            font-size: .85rem;
            opacity: .8;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .links a {
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Guilherme Torres</h1>

        <p class="descricao">
            Aulas no SENAI - Ultimo semestre de 2026
        </p>

        <div class="links">
            <a href="./28-07/index.html" target="_blank">🌐 28/07</a>
        </div>

        <footer>
            © 2026 - Todos os direitos reservados.
        </footer>

    </main>

</body>
</html>
