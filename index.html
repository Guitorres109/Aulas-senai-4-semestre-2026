<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light py-5">
    <div class="container">
        <div class="card exercise shadow">
            <div class="card-header">
                <h2 class="mb-0">Exercício 1: Produtos em Grids</h2>
            </div>
            <div class="card-body">
                <div class="task mb-4">
                    <strong>TAREFA:</strong>
                    <p class="mb-2">Complete as classes para que:</p>
                    <ul>
                        <li>Mobile: 1 por linha</li>
                        <li>Tablet: 2 por linha</li>
                        <li>Desktop: 3 por linha</li>
                    </ul>
                </div>
                <div class="row g-3">
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-primary text-white">Produto A</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-success text-white">Produto B</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-warning text-dark">Produto C</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-info text-white">Produto D</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-secondary text-white">Produto E</div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="box bg-dark text-white">Produto F</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
