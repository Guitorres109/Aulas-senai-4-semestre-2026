<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTX Mecatrônica — Automação Industrial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mec: {
                            bg: '#1B2024',
                            panel: '#242B30',
                            text: '#E7EAEC',
                            amber: '#E8B923',
                            blue: '#5B87A0',
                            line: '#333B40',
                        }
                    },
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['IBM Plex Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-mec-bg text-mec-text font-body antialiased">
    <header class="sticky top-0 z-50 border-b border-mec-line bg-mec-bg/90 backdrop-blur">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
            <a href="#" class="font-display text-2xl font-bold">MTX<span class="text-mec-amber">Mecatrônica</span>
            </a>
            <ul id="menu-desktop" class="hidden items-center gap-8 text-sm font-medium md:flex" >
                <li><a href="#solucoes" class="transition-colors hover:text-mec-amber">Soluções</a></li>
                <li><a href="#processo" class="transition-colors hover:text-mec-amber">Processos</a>
                </li>
                <li><a href="#cliente" class="transition-colors hover:text-mec-amber">Clientes</a></li>
                <li><a href="#contato" class="bg-mec-amber text-mec-bg px-4 py-2 rounded-full font-semibold hover:bg-mec-text transition-colors ">Pedir Orçamento</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
